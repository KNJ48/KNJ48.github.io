<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育館タイマー</title>
<style>
body{
  margin:0; background:#fff; color:#111;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.8; font-size:17px;
}
main{max-width:560px; margin:0 auto; padding:64px 24px}
h1{margin:0 0 8px; font-size:36px}
p{margin:0 0 32px}
a.dl{
  display:block; text-align:center; padding:18px 0;
  background:#111; color:#fff; text-decoration:none;
  font-size:20px; font-weight:bold; border-radius:6px;
}
a.web{
  display:block; text-align:center; padding:16px 0; margin-top:24px;
  border:2px solid #111; color:#111; text-decoration:none;
  font-size:20px; font-weight:bold; border-radius:6px;
}
a.dl:focus-visible,a.web:focus-visible{outline:3px solid #111; outline-offset:3px}
small{display:block; margin-top:8px; color:#666}
h2{margin:48px 0 8px; font-size:18px}
ol{margin:0; padding-left:1.4em}
</style>
</head>
<body>
<main>
  <h1>体育館タイマー</h1>
  <p>大きな数字で見やすい、シンプルなタイマー。</p>

  <a class="dl" id="dl" href="gym-timer.apk" download>Androidにダウンロード</a>
  <small id="meta">バージョン 1.0 / 42 MB</small>

  <a class="web" href="timer.html">ウェブで開く</a>

  <h2>インストール方法</h2>
  <ol>
    <li>ダウンロードしたファイルを開く</li>
    <li>「提供元不明のアプリ」を許可する</li>
    <li>インストールする</li>
  </ol>
</main>
<script>
// 書き換える場所
const CONFIG = { apk: "gym-timer.apk", version: "1.0", size: "42 MB" };
document.getElementById("dl").href = CONFIG.apk;
document.getElementById("meta").textContent =
  "バージョン " + CONFIG.version + " / " + CONFIG.size;
</script>
</body>
</html>
